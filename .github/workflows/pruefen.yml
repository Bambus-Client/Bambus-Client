# Prüft jede Änderung, bevor sie auf main kommt: baut Mod (1.21.11 und 26.x) und Launcher.
# Verteilt nichts – das macht erst auto-update.yml, wenn die Änderung auf main ist.
name: Änderung prüfen

on:
  pull_request:
  push:
    branches-ignore: [main, auto-update]

permissions:
  contents: read

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Signierschlüssel prüfen
        env:
          BAMBUS_SIGNIER_SCHLUESSEL: ${{ secrets.BAMBUS_SIGNIER_SCHLUESSEL }}
        run: |
          set -euo pipefail
          if [ -z "${BAMBUS_SIGNIER_SCHLUESSEL:-}" ]; then
            echo "::warning::Secret BAMBUS_SIGNIER_SCHLUESSEL ist hier nicht verfügbar – Updates würden nicht verteilt (siehe SICHERHEIT.md)."
            exit 0
          fi
          umask 077
          printf '%s\n' "$BAMBUS_SIGNIER_SCHLUESSEL" > "$RUNNER_TEMP/s.pem"
          echo test > "$RUNNER_TEMP/t.txt"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/s.pem" -out "$RUNNER_TEMP/t.sig" "$RUNNER_TEMP/t.txt"
          oeff=$(openssl pkey -in "$RUNNER_TEMP/s.pem" -pubout -outform DER | base64 -w0)
          rm -f "$RUNNER_TEMP/s.pem"
          if grep -q "$oeff" launcher/src/de/bambus/launcher/Sicherheit.java; then
            echo "Signierschlüssel passt zum Launcher ✔"
          else
            echo "::error::Das Secret passt nicht zum öffentlichen Schlüssel in Sicherheit.java."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Mod und Launcher für 1.21.11 bauen
        run: bash ./gradlew build --no-daemon

      - name: Selbsttests (Mod-Scanner, Profil)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scan/klassen" "$RUNNER_TEMP/scan/home"
          javac --release 8 -Xlint:-options -encoding UTF-8 -d "$RUNNER_TEMP/scan/klassen" \
            launcher/src/de/bambus/launcher/*.java $(find gemeinsam/src -name "*.java") \
            werkzeuge/tests/de/bambus/launcher/*.java
          java -Duser.home="$RUNNER_TEMP/scan/home" -cp "$RUNNER_TEMP/scan/klassen" de.bambus.launcher.ModScannerTest
          mkdir -p "$RUNNER_TEMP/scan/home2"
          java -Duser.home="$RUNNER_TEMP/scan/home2" -cp "$RUNNER_TEMP/scan/klassen" de.bambus.launcher.ProfilTest

      - name: Mod für Minecraft 26.x bauen
        run: |
          cd versionen/neu
          for mc in 26.1 26.2 26.3; do
            JAVA_HOME="$JAVA_HOME_25_X64" bash ./gradlew build -Pmc=$mc --no-daemon
          done

