# Baut den Bambus Launcher als Windows-Programm (Java eingebaut) und das Installationsprogramm.
# Start: von Hand unter „Actions → Windows-Launcher bauen → Run workflow“ oder automatisch bei einem Tag v*.
# Bei einem Tag (oder wenn beim Start ein Release-Tag eingetragen ist) entsteht ein GitHub-Release mit
# Launcher-Setup (.exe), Launcher als Zip und der Client-Mod als Bambus-Client-standalone.jar.
name: Windows-Launcher bauen

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release-Tag, z. B. v3.4.0 (leer = nur bauen)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # für die Bau-Nummer (Selbst-Update)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25 für die Mod ab Minecraft 26.1, 21 (zuletzt genannt = Standard) für 1.21.11 und den Launcher
          java-version: |
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Bambus-Mod für Minecraft 26.x bauen
        shell: bash
        run: |
          cd versionen/neu
          for mc in 26.1 26.2 26.3; do
            JAVA_HOME="$JAVA_HOME_25_X64" bash ./gradlew build -Pmc=$mc --no-daemon
          done

      - name: Mod und Launcher bauen
        shell: bash
        run: bash ./gradlew build --no-daemon

      - name: Version lesen
        id: version
        shell: bash
        run: echo "nummer=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Launcher als Windows-Programm (jpackage, Java eingebaut)
        shell: bash
        run: |
          mkdir -p eingabe
          cp build/libs/BambusLauncher.jar eingabe/
          jpackage --type app-image \
            --name "Bambus Launcher" \
            --input eingabe \
            --main-jar BambusLauncher.jar \
            --main-class de.bambus.launcher.BambusLauncher \
            --icon launcher/packaging/bambus.ico \
            --app-version "${{ steps.version.outputs.nummer }}" \
            --vendor Bambus \
            --add-modules java.se,jdk.crypto.ec,jdk.charsets,jdk.localedata,jdk.unsupported,jdk.zipfs,jdk.accessibility \
            --dest ausgabe

      - name: Installationsprogramm (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.version.outputs.nummer }}" "/O$PWD\ausgabe" "launcher\packaging\windows\bambus.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip ohne Installation
        shell: pwsh
        run: Compress-Archive -Path "ausgabe\Bambus Launcher" -DestinationPath "ausgabe\Bambus-Launcher-Windows.zip"

      - name: Client-Mod als standalone
        shell: bash
        run: cp "build/libs/bambus-client-${{ steps.version.outputs.nummer }}.jar" ausgabe/Bambus-Client-standalone.jar

      - uses: actions/upload-artifact@v4
        with:
          name: Bambus-Launcher-Windows
          path: |
            ausgabe/Bambus-Launcher-Setup.exe
            ausgabe/Bambus-Launcher-Windows.zip
            ausgabe/Bambus-Client-standalone.jar
            build/libs/BambusLauncher.jar

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Bambus Client ${{ steps.version.outputs.nummer }}
          body_path: .github/release-notizen.md
          files: |
            ausgabe/Bambus-Launcher-Setup.exe
            ausgabe/Bambus-Launcher-Windows.zip
            ausgabe/Bambus-Client-standalone.jar
