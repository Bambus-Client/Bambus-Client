name: Bambus Client bauen

# Baut die Mod und den Launcher (mit eingebauter Mod) und daraus:
#   Bambus-Launcher-Setup.exe        Windows-Installer (Inno Setup, Java eingebaut)
#   Bambus-Launcher-Windows.zip      Windows ohne Installation
#   Bambus-Launcher-Mac-AppleSilicon.dmg / Bambus-Launcher-Mac-Intel.dmg
#   BambusLauncher.jar, bambus-client-<version>.jar
# Bei einem Release (Tag v*) landen alle Dateien automatisch im Release.

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  jar:
    name: Mod + Launcher (JAR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Version lesen
        id: v
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Bauen
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Mod-Datei bereitlegen
        run: |
          mkdir -p ausgabe
          cp build/libs/BambusLauncher.jar ausgabe/
          cp "build/libs/bambus-client-${{ steps.v.outputs.version }}.jar" ausgabe/
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ausgabe/*.jar

  windows:
    name: Windows (Setup.exe + Zip)
    needs: jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: eingabe
      - name: App mit eingebautem Java (jpackage)
        shell: pwsh
        run: |
          Remove-Item eingabe\bambus-client-*.jar
          jpackage --type app-image --name "Bambus Launcher" --input eingabe `
            --main-jar BambusLauncher.jar --main-class de.bambus.launcher.BambusLauncher `
            --icon launcher\packaging\bambus.ico --app-version "${{ needs.jar.outputs.version }}" `
            --vendor Bambus --dest ausgabe
          Compress-Archive -Path "ausgabe\Bambus Launcher" -DestinationPath Bambus-Launcher-Windows.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ needs.jar.outputs.version }}" "/O$PWD" launcher\packaging\windows\bambus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Bambus-Launcher-Setup.exe
            Bambus-Launcher-Windows.zip

  mac:
    name: Mac (${{ matrix.name }})
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: AppleSilicon
          - runner: macos-15-intel
            name: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: eingabe
      - name: DMG (jpackage)
        run: |
          rm eingabe/bambus-client-*.jar
          jpackage --type dmg --name "Bambus Launcher" --input eingabe \
            --main-jar BambusLauncher.jar --main-class de.bambus.launcher.BambusLauncher \
            --icon launcher/packaging/bambus.icns --app-version "${{ needs.jar.outputs.version }}" \
            --vendor Bambus --dest ausgabe
          mv ausgabe/*.dmg "Bambus-Launcher-Mac-${{ matrix.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.name }}
          path: Bambus-Launcher-Mac-*.dmg

  release:
    name: Release-Dateien hochladen
    if: github.event_name == 'release'
    needs: [jar, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dateien
          merge-multiple: true
      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dateien/* --clobber --repo "${{ github.repository }}"
